plugins {
    id 'eclipse'
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = "AnnoyingVillagers-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

def clientOnlyRuntime = configurations.create('clientOnlyRuntime')
sourceSets {
    clientRun {
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
configurations.clientRunRuntimeOnly.extendsFrom clientOnlyRuntime

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
            sourceSet = sourceSets.clientRun
            if (providers.gradleProperty('clientSmoke').map { it.toBoolean() }.getOrElse(false)) {
                systemProperty 'annoyingvillagers.portClientSmoke', 'true'
                programArguments.addAll '--quickPlaySingleplayer', 'port-smoke'
            }
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').absolutePath, '--existing', file('src/main/resources/').absolutePath
        }

        configureEach {
            if (providers.gradleProperty('validationRun').map { it.toBoolean() }.getOrElse(false)) {
                gameDirectory = file("build/porting/run-${name}")
            }
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = providers.gradleProperty('validationRun').map { it.toBoolean() }.getOrElse(false) ? org.slf4j.event.Level.INFO : org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Port checks run in Minecraft, and are excluded from ordinary release jars.
if (providers.gradleProperty('portTests').map { it.toBoolean() }.getOrElse(false)) {
    sourceSets.main.java.srcDir 'src/gametest/java'
    sourceSets.main.resources.srcDir 'src/gametest/resources'
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    mavenCentral()
    maven { url = uri('https://cursemaven.com') }
    maven { url = uri('https://api.modrinth.com/maven') }
    maven { url = uri('https://maven.architectury.dev') }
}

dependencies {
    compileOnly "curse.maven:smart-npc-1709932:9424598"

    implementation "dev.architectury:architectury-neoforge:19.0.1"

    implementation "maven.modrinth:cloth-config:Wsus0EWg"
    implementation "maven.modrinth:player-animation-library:uue016SO"
    compileOnly "maven.modrinth:better-combat:lkzLyXbV"
    compileOnly "curse.maven:punchy-1374153:9408716"
    if (providers.gradleProperty('compatRuntime').map { it.toBoolean() }.getOrElse(true)) {
        localRuntime "curse.maven:smart-npc-1709932:9424598"
        localRuntime "maven.modrinth:better-combat:lkzLyXbV"
        add('clientOnlyRuntime', "curse.maven:punchy-1374153:9408716")
    }

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.0"))
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('jar', Jar).configure {
    destinationDirectory = file('C:/Users/Admin/Desktop/Minecraft/delivery/annoyingvillagers')
    manifest {
        attributes([
                'Specification-Title'      : mod_id,
                'Specification-Vendor'     : mod_authors,
                'Specification-Version'    : '1',
                'Implementation-Title'     : project.name,
                'Implementation-Version'   : project.jar.archiveVersion,
                'Implementation-Vendor'    : mod_authors,
                'Implementation-Timestamp' : new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven { url = "file://${project.projectDir}/mcmodsrepo" }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '2000']
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
